AWSTemplateFormatVersion: '2010-09-09'
Description: Cross-account IAM role for LZA external pipeline deployment

Parameters:
  ExternalPipelineAccountId:
    Type: String
    Description: AWS Account ID of the external pipeline account
    AllowedPattern: '^\d{12}$'

  AcceleratorQualifier:
    Type: String
    Description: |
      CRITICAL: Must match the AcceleratorQualifier used in the Installer Stack deployment
      in the external pipeline account. This qualifier names the cross-account role and must
      be consistent across both accounts for external pipeline deployments to work.

      Pattern: lowercase letters, numbers, hyphens only. Must start with letter(s) and end
      with letter or number. Length: 3-63 characters.

      Examples: "prod", "lza", "dev", "env-production"
    AllowedPattern: '^[a-z]+[a-z0-9-]{1,61}[a-z0-9]+$'
    ConstraintDescription: |
      Qualifier must include lowercase letters and numbers only (3-63 characters).
      Must start with letter(s), end with letter or number.
      Cannot use uppercase, underscores, or special characters except hyphens.
    Default: prod

Resources:
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AcceleratorQualifier}-installer-admin-role'
      Description: Cross-account role for LZA pipeline deployment from external account
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${ExternalPipelineAccountId}:root'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'
      Tags:
        - Key: Purpose
          Value: LZA-External-Pipeline

Outputs:
  PipelineRoleArn:
    Description: ARN of the cross-account pipeline role
    Value: !GetAtt PipelineRole.Arn
    Export:
      Name: LZA-Pipeline-Role-Arn

  PipelineRoleName:
    Description: Name of the cross-account pipeline role
    Value: !Ref PipelineRole
